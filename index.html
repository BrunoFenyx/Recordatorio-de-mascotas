<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Un rincón para volver a ver, escuchar y recordar a nuestras mascotas.">
  <meta name="theme-color" content="#fbf6f0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Recuerdos de mascotas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="page-glow" aria-hidden="true"></div>

  <header class="hero container">
    <span class="hero-eyebrow">
      <i class="bi bi-heart-fill" aria-hidden="true"></i>
      Las mascotas de la familia
    </span>
    <h1 class="hero-title"><em>Siempre</em> con nosotros</h1>
    <p class="hero-text">
      Un espacio para volver a verlos y recorrer esos
      pequeños momentos que se quedaron para siempre con nosotros.
    </p>
    <div class="hero-paws" aria-hidden="true">
      <i class="bi bi-paw-fill"></i>
      <span></span>
      <i class="bi bi-paw-fill"></i>
    </div>
  </header>

  <main class="container app-container" id="app" aria-live="polite">
    <div class="loading-state">
      <div class="spinner-border" role="status" aria-hidden="true"></div>
      <p>Cargando recuerdos…</p>
    </div>
  </main>

  <footer class="site-footer container text-center pb-5">
    <p>Hecho con amor para quienes nos acompañan toda la vida.</p>
  </footer>

  <div class="modal fade" id="mediaModal" tabindex="-1" aria-labelledby="mediaModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-heading">
            <span class="modal-kicker" id="mediaModalKicker">Recuerdo</span>
            <h2 class="modal-title" id="mediaModalTitle">Recuerdo</h2>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body media-body" id="mediaModalBody"></div>
        <div class="modal-footer">
          <span class="modal-note" id="mediaModalNote"></span>
          <a class="btn-original" id="mediaModalLink" href="#" target="_blank" rel="noopener">
            Abrir original
            <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </div>
  </div>

  <noscript>
    <div class="container pb-5">
      <div class="alert alert-warning">Necesitás activar JavaScript para ver los recuerdos.</div>
    </div>
  </noscript>

  <div class="audio-players" id="audioPlayers" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
